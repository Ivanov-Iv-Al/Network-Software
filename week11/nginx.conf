events {}
http {
    upstream devices_upstream {
        server devices-app:8106;
    }
    server {
        listen 80;
        location /api/devices {
            proxy_pass http://devices_upstream;
        }
        location /ws {
            proxy_pass http://signaling:8765;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }
    }
}