syntax = "proto3";

service TaskService {
  rpc CreateTask (CreateTaskRequest) returns (Task);
  rpc GetTask (GetTaskRequest) returns (Task);
  rpc ListTasks (ListTasksRequest) returns (ListTasksResponse);
}

message CreateTaskRequest {
  string user_id = 1;
  string title = 2;
  string description = 3;
}

message Task {
  string id = 1;
  string user_id = 2;
  string title = 3;
  string status = 4;
  string created_at = 5;
}