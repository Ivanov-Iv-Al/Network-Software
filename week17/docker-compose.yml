version: '3.8'

networks:
  app-network:
    driver: bridge

services:
  postgres:
    image: postgres:15-alpine
    container_name: postgres-db
    environment:
      POSTGRES_USER: ${DB_USER:-taskuser}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-secret}
      POSTGRES_DB: ${DB_NAME:-taskdb}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - app-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-taskuser}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  task-service:
    build: ./task-service
    container_name: task-service
    environment:
      DATABASE_URL: postgresql://${DB_USER:-taskuser}:${DB_PASSWORD:-secret}@postgres:5432/${DB_NAME:-taskdb}
      NOTIFY_HOST: notify-service
      NOTIFY_PORT: 50051
    ports:
      - "8000:8000"
    networks:
      - app-network
    depends_on:
      postgres:
        condition: service_healthy
      notify-service:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

  notify-service:
    build: ./notify-service
    container_name: notify-service
    ports:
      - "50051:50051"
    networks:
      - app-network
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    container_name: api-gateway
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      - app-network
    depends_on:
      task-service:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data: