services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_DB: tasks
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: secret
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d tasks"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    volumes:
      - redisdata:/data

  task-service:
    build: ./task-service
    environment:
      DB_HOST: postgres
      DB_PASSWORD: secret
      DB_NAME: tasks
      DB_USER: admin
    depends_on:
      postgres:
        condition: service_healthy

  api-gateway:
    build: ./api-gateway
    ports:
      - "8080:8080"
    environment:
      TASK_SERVICE_URL: http://task-service:5000
      JWT_SECRET: super-secret-key
    depends_on:
      - task-service

volumes:
  pgdata:
  redisdata:
