syntax = "proto3";

package ticketsservice;

service TicketsService {
    rpc GetTicketPrice (TicketRequest) returns (TicketResponse);
    rpc SubscribePriceChanges (TicketRequest) returns (stream PriceUpdate);
}

message TicketRequest {
    string ticket_id = 1;
    string user_id = 2;
}

message TicketResponse {
    string ticket_id = 1;
    double price = 2;
    string currency = 3;
    string event_name = 4;
    string message = 5;
}

message PriceUpdate {
    string ticket_id = 1;
    double new_price = 2;
    int64 timestamp = 3;
    string message = 4;
    int32 update_number = 5;
}